models:
  - name: stg_transactions
    description: Cleaned, typed transactions.
    columns:
      - name: transaction_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests: [not_null]
      - name: transaction_date
        data_tests: [not_null]
      - name: amount
        data_tests: [not_null]
      - name: is_fraud_actual
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]
                quote: false

  - name: stg_transactions_quarantine
    description: Rejected rows with a reason column.
    columns:
      - name: reason
        data_tests: [not_null]